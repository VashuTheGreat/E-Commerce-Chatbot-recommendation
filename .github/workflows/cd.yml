name: Deploy to HuggingFace Space

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face CLI
        run: |
          pip install -U "huggingface_hub[cli]"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run vector ingestion
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MLFLOW_API_KEY: ${{ secrets.MLFLOW_API_KEY }}
          DAGSHUB_OWNER: ${{ secrets.DAGSHUB_OWNER }}
          DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          chmod +x scripts/vec_ingest_data.sh
          uv run ./scripts/vec_ingest_data.sh

      - name: Remove heavy/unnecessary dirs
        run: |
          echo "🗑️ Removing notebook/styles to skip large unused files..."
          rm -rf notebook/styles
          
          echo "🗑️ Removing notebook/vector_data to skip large unused files..."
          rm -rf notebook/vector_data

      - name: Configure Space Meta
        env:
          PROJECT_NAME: "E-Commerce-Chatbot-recommendation"
        run: |
          echo "📝 Injecting HF Spaces configuration into README.md..."
          TEMP_README=$(mktemp)
          cat << 'EOF' > "$TEMP_README"
          ---
          title: E-Commerce-Chatbot-recommendation
          emoji: ✨
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_file: main.py
          pinned: false
          short_description: AI-powered E-Commerce Chatbot with product recommendations
          ---

          EOF
          cat README.md >> "$TEMP_README"
          mv "$TEMP_README" README.md

      - name: Authenticate and Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          HF_USERNAME: "VashuTheGreat2"
          SPACE_NAME: "E-Commerce-Chatbot-recommendation"
        run: |
          echo "🔐 Logging into Hugging Face..."
          hf auth login --token "$HF_TOKEN"
          
          echo "🚀 Creating HF Space if it doesn't exist..."
          hf repos create "$HF_USERNAME/$SPACE_NAME" --type space --space-sdk docker || true
          
          echo "📤 Uploading project files..."
          hf upload "$HF_USERNAME/$SPACE_NAME" . \
            --repo-type=space \
            --exclude ".venv/*" \
            --exclude "artifacts/*" \
            --exclude "notebook/*" \
            --exclude ".pytest_cache/*" \
            --exclude "logs/*" \
            --exclude "build/*" \
            --exclude "data/*" \
            --exclude "__pycache__/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.db" \
            --exclude "*.pkl" \
            --exclude "*.log" \
            --exclude "*.zip" \
            --exclude "*.pt" \
            --exclude "*.png"
