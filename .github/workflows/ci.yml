name: Continuous Integration

on:
  pull_request:
    branches: ["main"]
  

env:
  PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  MLFLOW_API_KEY: ${{ secrets.MLFLOW_API_KEY }}
  DAGSHUB_OWNER: ${{ secrets.DAGSHUB_OWNER }}
  DAGSHUB_REPO: ${{ secrets.DAGSHUB_REPO }}
  HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  Dockerizing:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            -t e-commerce-recommendation \
            --build-arg PINECONE_API_KEY="${PINECONE_API_KEY}" \
            --build-arg GROQ_API_KEY="${GROQ_API_KEY}" \
            --build-arg MLFLOW_API_KEY="${MLFLOW_API_KEY}" \
            --build-arg DAGSHUB_OWNER="${DAGSHUB_OWNER}" \
            --build-arg DAGSHUB_REPO="${DAGSHUB_REPO}" \
            --build-arg HUGGINGFACE_API_KEY="${HUGGINGFACE_API_KEY}" \
            --load \
            .
