[pytest]
# Add the project root (which contains the `src` package) to the Python path
# This lets imports like `from src.components.data_ingestion import Data_Ingestor`
# work without needing to modify `sys.path` in individual test files.
pythonpath = .
# Shorten tracebacks for clearer test output
addopts = -ra -q
# Test discovery pattern (default is test_*.py or *_test.py)
testpaths = src/tests
