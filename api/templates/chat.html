<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat &middot; E-Commerce Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    /* Image preview strip */
    #img-preview-wrap {
      display: none;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.6rem;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
    }
    #img-preview-wrap img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 0.35rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    #img-preview-name {
      font-size: 0.75rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    #img-remove-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(239,68,68,0.2);
      border: 1px solid rgba(239,68,68,0.4);
      color: #f87171;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
      transition: background 0.15s;
    }
    #img-remove-btn:hover { background: rgba(239,68,68,0.4); }

    /* Upload trigger button */
    #upload-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 0.5rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #upload-trigger:hover { border-color: var(--accent); color: #fff; }

    /* Hint text */
    .input-hint {
      font-size: 0.65rem;
      color: #475569;
      padding-top: 0.15rem;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="border-b border-slate-700 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="badge">Session</span>
      <span id="thread-label" class="text-sm text-slate-300">checking&hellip;</span>
      <span id="session-timer" class="badge success">--:--</span>
   </div>
    <nav class="flex items-center gap-4 text-sm">
      <a class="underline hover:text-white" href="/train">Train</a>
      <a class="underline hover:text-white" href="/health">Health</a>
      <button id="logout-btn" type="button" class="btn" style="background:#ef4444">Logout</button>
   </nav>
 </header>

  <main class="container" style="max-width:760px">
    <section id="chat-log" class="card space-y-3" style="min-height:60vh;overflow-y:auto;display:flex;flex-direction:column;">
      <div id="empty-state" class="text-slate-400 text-center py-8">
        Ask anything about products &hellip; optionally attach an image.
     </div>
   </section>

    <form id="chat-form" class="mt-4 flex flex-col gap-2">
      <!-- Image preview strip (shown after file is picked) -->
      <div id="img-preview-wrap">
        <img id="img-preview-thumb" src="" alt="Preview">
        <span id="img-preview-name"></span>
        <button type="button" id="img-remove-btn" title="Remove image">&times;</button>
      </div>

      <!-- Textarea -->
      <textarea
        id="chat-input"
        class="input"
        rows="3"
        placeholder="Type a message… (Enter to send, Shift+Enter for new line)"
        required
      ></textarea>

      <!-- Controls row -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Hidden real file input -->
        <input id="chat-file" type="file" accept="image/*" class="hidden">
        <!-- Styled trigger -->
        <button type="button" id="upload-trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4-4a3 3 0 014.24 0L16 16m-2-2l1.59-1.59a3 3 0 014.24 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          Attach Image
        </button>
        <span class="input-hint">Shift+Enter for new line</span>
        <button type="submit" class="btn ml-auto" id="send-btn">Send</button>
      </div>
    </form>
  </main>

  <script src="/static/js/constants.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/chat.js"></script>
</body>
</html>
