<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &middot; Aura AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #0f172a 70%);
      min-height: 100vh;
    }
    .glass-nav {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    /* Session duration option cards */
    .session-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 1rem 0.75rem;
      border-radius: 0.75rem;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(51, 65, 85, 0.8);
      cursor: pointer;
      transition: all 0.2s ease;
      color: #e2e8f0;
    }
    .session-option:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -4px rgba(99,102,241,0.2);
    }
    .session-option .duration {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
    }
    .session-option .unit {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body class="text-slate-100">

  <!-- Navbar — same glass style as home page -->
  <nav class="glass-nav sticky top-0 z-50 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">

      <!-- Left: Logo -->
      <a href="/" class="flex items-center gap-2 no-underline">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">A</div>
        <span class="text-xl font-bold tracking-tight text-white">Aura <span class="text-indigo-400 font-medium text-base">AI</span></span>
      </a>

      <!-- Right: nav links -->
      <div class="flex items-center gap-4 text-sm font-medium text-slate-300">
        <a href="/health" class="hidden sm:flex items-center gap-1.5 hover:text-white transition-colors">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
          System Health
        </a>
        <a href="/" class="hidden sm:inline-block text-xs font-semibold px-4 py-2 border border-slate-700 hover:border-slate-500 rounded-lg transition-colors">← Home</a>
      </div>

    </div>
  </nav>

  <!-- Login content -->
  <div class="container" style="max-width: 480px; padding-top: 4rem;">

    <header class="mb-8 text-center space-y-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-950/80 border border-indigo-800 text-indigo-300 text-xs font-semibold tracking-wide">
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
        </span>
        E-Commerce Recommendation Chatbot
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">Start a session</h1>
      <p class="text-slate-400 text-sm leading-relaxed">Pick how long you want the chat to stay alive.<br>Your session auto-deletes after expiry.</p>
    </header>

    <section class="card" style="background: rgba(30,41,59,0.65); backdrop-filter: blur(16px); border: 1px solid rgba(51,65,85,0.8); border-radius: 1rem; padding: 1.75rem;">
      <div id="loading" class="flex items-center gap-2 text-slate-400">
        <span class="spinner"></span>
        <span>Loading options&hellip;</span>
      </div>

      <div id="options" class="grid grid-cols-2 gap-3 hidden"></div>

      <p id="status" class="mt-4 text-sm text-slate-400"></p>
    </section>

    <nav class="mt-6 text-center text-xs text-slate-500 flex items-center justify-center gap-4">
      <a class="hover:text-slate-300 transition-colors" href="/health">Server health</a>
      <span>&middot;</span>
      <a class="hover:text-slate-300 transition-colors" href="/chat">Skip to chat</a>
    </nav>
  </div>

  <script src="/static/js/constants.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
