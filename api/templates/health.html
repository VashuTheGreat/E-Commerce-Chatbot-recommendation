<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Health &middot; E-Commerce Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <header class="border-b border-slate-700 px-4 py-3 flex items-center justify-between">
    <h1 class="text-xl font-bold">Server Dashboard</h1>
    <nav class="flex items-center gap-4 text-sm">
      <a class="underline hover:text-white" href="/login">Login</a>
      <a class="underline hover:text-white" href="/chat">Chat</a>
      <a class="underline hover:text-white" href="/train">Train</a>
  </nav>
</header>

  <main class="container" style="max-width:880px">
    <section class="card mt-6">
      <div class="flex items-center gap-3">
        <span class="badge">Status</span>
        <span id="health-badge" class="badge">checking&hellip;</span>
    </div>
      <p id="health-msg" class="mt-3 text-slate-300"></p>
  </section>

    <section class="card mt-4">
      <h2 class="text-lg font-bold mb-3">Available session durations</h2>
      <div id="time-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
  </section>

    <section class="card mt-4">
      <h2 class="text-lg font-bold mb-3">API endpoints</h2>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-slate-400">
          <th class="py-2">Method</th><th>Path</th><th>Auth</th>
      </tr></thead>
        <tbody id="api-table"></tbody>
    </table>
  </section>
</main>

  <script src="/static/js/constants.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/health.js"></script>
</body>
</html>
