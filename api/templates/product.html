<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product · Aura AI</title>
  <meta name="description" content="Product details — Aura AI e-commerce platform.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a; --bg2: #1e293b; --bg3: #0d1526;
      --border: rgba(51,65,85,0.8); --accent: #6366f1;
      --accent2: #818cf8; --muted: #94a3b8; --text: #e2e8f0;
      --gold: #f59e0b; --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* NAV */
    nav { background: rgba(15,23,42,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; padding: 0.75rem 1.5rem; }
    .nav-inner { max-width: 1200px; margin: auto; display: flex; align-items: center; gap: 1rem; }
    .logo { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; }
    .logo-box { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 0.9rem; }
    .logo-text { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .logo-text span { color: var(--accent2); font-weight: 500; font-size: 0.9rem; }
    .back-btn { display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.9rem; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 0.82rem; font-weight: 600; text-decoration: none; transition: all .2s; margin-left: auto; }
    .back-btn:hover { border-color: var(--accent2); color: #fff; }

    /* PAGE */
    .page { max-width: 1200px; margin: auto; padding: 2rem 1.5rem; }

    /* BREADCRUMB */
    .breadcrumb { font-size: 0.78rem; color: var(--muted); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.4rem; }
    .breadcrumb a { color: var(--accent2); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* PRODUCT LAYOUT */
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: start; }
    @media (max-width: 768px) { .product-grid { grid-template-columns: 1fr; gap: 1.5rem; } }

    /* IMAGE SECTION */
    .img-wrap { position: relative; background: #1a2540; border-radius: 20px; border: 1px solid var(--border); overflow: hidden; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
    .img-wrap:hover img { transform: scale(1.04); }
    .img-placeholder { font-size: 5rem; opacity: .2; }
    .discount-tag { position: absolute; top: 1rem; left: 1rem; background: var(--green); color: #fff; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; }

    /* DETAIL SECTION */
    .detail { display: flex; flex-direction: column; gap: 1.25rem; }
    .brand { font-size: 0.75rem; color: var(--accent2); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .product-name { font-size: 1.9rem; font-weight: 800; line-height: 1.25; color: #fff; }
    .usage-chip { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--muted); background: var(--bg2); border: 1px solid var(--border); padding: 4px 12px; border-radius: 999px; }
    .price-row { display: flex; align-items: baseline; gap: 0.75rem; }
    .price { font-size: 2.2rem; font-weight: 800; color: #fff; }
    .price-orig { font-size: 1.1rem; color: var(--muted); text-decoration: line-through; }
    .price-save { font-size: 0.82rem; font-weight: 700; color: var(--green); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.25); padding: 3px 10px; border-radius: 999px; }
    .stars { display: flex; gap: 2px; align-items: center; }
    .star { color: var(--gold); font-size: 1rem; }

    /* DESCRIPTION */
    .desc-label { font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
    .desc-text { font-size: 0.9rem; color: var(--muted); line-height: 1.7; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }

    /* CTA BUTTONS */
    .cta-row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn-primary { flex: 1; min-width: 160px; padding: 0.85rem 1.5rem; background: linear-gradient(135deg, #6366f1, #7c3aed); border: none; border-radius: 12px; color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,.35); }
    .btn-ghost { flex: 1; min-width: 160px; padding: 0.85rem 1.5rem; background: transparent; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; text-decoration: none; }
    .btn-ghost:hover { border-color: var(--accent2); color: #fff; }

    /* META CHIPS */
    .meta-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip { font-size: 0.75rem; color: var(--muted); background: var(--bg2); border: 1px solid var(--border); padding: 4px 12px; border-radius: 999px; }
    .chip strong { color: var(--text); }

    /* DIVIDER */
    .divider { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }

    /* RELATED PRODUCTS */
    .section-heading { font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.75rem; }
    .section-heading::before { content: ''; display: block; width: 4px; height: 22px; background: linear-gradient(180deg, #6366f1, #7c3aed); border-radius: 999px; }
    .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1rem; }

    /* PRODUCT CARDS (reused style) */
    .prod-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: all .25s; }
    .prod-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 16px 40px rgba(99,102,241,.15); }
    .card-img-wrap { aspect-ratio: 1; background: #1a2540; overflow: hidden; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
    .prod-card:hover .card-img-wrap img { transform: scale(1.05); }
    .card-body { padding: 0.75rem; }
    .card-brand { font-size: 0.68rem; color: var(--accent2); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
    .card-name { font-size: 0.82rem; font-weight: 600; line-height: 1.3; margin-bottom: 0.35rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-price { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .score-badge { font-size: 0.65rem; font-weight: 700; padding: 2px 7px; background: rgba(99,102,241,.2); border: 1px solid rgba(99,102,241,.4); border-radius: 999px; color: var(--accent2); display: inline-block; margin-top: 0.25rem; }

    /* SKELETON */
    .skeleton { background: linear-gradient(90deg, var(--bg2) 25%, #253047 50%, var(--bg2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-card { aspect-ratio: 0.8; }
    .skel-img { aspect-ratio: 1; border-radius: 20px; }
    .skel-line { height: 1.2rem; border-radius: 6px; margin-bottom: 0.6rem; }

    /* SPINNER */
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TOAST */
    #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--border); padding: 0.6rem 1.5rem; border-radius: 8px; font-size: 0.83rem; color: var(--muted); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 300; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo">
      <div class="logo-box">A</div>
      <span class="logo-text">Aura <span>AI</span></span>
    </a>
    <a href="/shop" class="back-btn">
      ← Back to Shop
    </a>
  </div>
</nav>

<div class="page">
  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb">
    <a href="/">Home</a> / <a href="/shop">Shop</a> / <span id="bc-name">Loading…</span>
  </div>

  <!-- Product detail skeleton while loading -->
  <div id="product-skeleton" class="product-grid">
    <div class="skeleton skel-img"></div>
    <div style="display:flex;flex-direction:column;gap:1rem;padding-top:1rem">
      <div class="skeleton skel-line" style="width:40%;height:0.8rem"></div>
      <div class="skeleton skel-line" style="width:80%;height:1.8rem"></div>
      <div class="skeleton skel-line" style="width:55%;height:1.8rem"></div>
      <div class="skeleton skel-line" style="width:90%;height:0.9rem"></div>
      <div class="skeleton skel-line" style="width:70%;height:0.9rem"></div>
      <div class="skeleton skel-line" style="width:60%;height:3rem;border-radius:12px"></div>
    </div>
  </div>

  <!-- Actual product content -->
  <div id="product-content" style="display:none">
    <div class="product-grid">
      <!-- Image -->
      <div class="img-wrap" id="img-wrap">
        <span class="img-placeholder" id="img-placeholder">🛍️</span>
        <img id="product-img" src="" alt="" style="display:none" onerror="this.style.display='none';document.getElementById('img-placeholder').style.display='block'">
        <div class="discount-tag" id="discount-tag" style="display:none"></div>
      </div>

      <!-- Details -->
      <div class="detail">
        <div class="brand" id="product-brand"></div>
        <h1 class="product-name" id="product-name"></h1>
        <div class="meta-chips" id="product-chips"></div>
        <div class="price-row">
          <span class="price" id="product-price"></span>
          <span class="price-orig" id="product-price-orig" style="display:none"></span>
          <span class="price-save" id="product-price-save" style="display:none"></span>
        </div>
        <div class="stars" id="product-stars"></div>
        <div>
          <div class="desc-label" style="margin-bottom:0.5rem">Description</div>
          <div class="desc-text" id="product-desc"></div>
        </div>
        <div class="cta-row">
          <a href="/login" class="btn-primary">
            🤖 Ask AI About This
          </a>
          <a href="/shop" class="btn-ghost">
            ← Browse More
          </a>
        </div>
      </div>
    </div>

    <hr class="divider">

    <!-- Related products -->
    <div class="section-heading">You Might Also Like</div>
    <div id="related-status"></div>
    <div id="related-grid" class="related-grid">
      <!-- Skeletons shown while loading -->
      <div class="skeleton skel-card"></div>
      <div class="skeleton skel-card"></div>
      <div class="skeleton skel-card"></div>
      <div class="skeleton skel-card"></div>
      <div class="skeleton skel-card"></div>
      <div class="skeleton skel-card"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API = '/api/v1/products';
const productId = {{ product_id }};

function safeImg(url) { return (url || '').replace(/^http:\/\//i, 'https://'); }

function parseMeta(raw) {
  if (!raw) return {};
  if (typeof raw === 'object') return raw;
  try { return JSON.parse(raw); } catch {}
  try {
    const fixed = raw
      .replace(/'/g, '"')
      .replace(/\bTrue\b/g, 'true')
      .replace(/\bFalse\b/g, 'false')
      .replace(/\bNone\b/g, 'null');
    return JSON.parse(fixed);
  } catch(e) {
    console.warn('[parseMeta] failed:', raw, e);
    return {};
  }
}

function rupee(n) { return n ? '₹' + Number(n).toLocaleString('en-IN') : ''; }

function stars(n = 4) {
  const full = Math.round(n);
  return Array.from({length: 5}, (_, i) =>
    `<span class="star">${i < full ? '★' : '☆'}</span>`).join('');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Load product ────────────────────────────────────────────────────────────
async function loadProduct() {
  try {
    const res = await fetch(`${API}/${productId}`);
    const data = await res.json();
    console.log('[product] raw API response:', data);

    if (!data.success || !data.data?.length) {
      document.getElementById('product-skeleton').innerHTML =
        '<p style="color:var(--muted);padding:3rem;text-align:center">Product not found.</p>';
      return;
    }

    const p = Array.isArray(data.data) ? data.data[0] : data.data;
    const meta = parseMeta(p.meta_data || p.metadata);
    console.log('[product] parsed meta:', meta);

    const name    = meta.name     || p.name     || p.product_search_description || 'Product';
    const brand   = meta.brand    || p.brand    || '';
    const price   = meta.discounted_price || p.discounted_price || meta.price || p.price || '';
    const orig    = meta.price    || p.price    || '';
    const imgUrl  = safeImg(meta.image_url || p.image_url || '');
    const variant = meta.variant  || p.variant  || '';
    const usage   = meta.usage    || p.usage    || '';
    const desc    = p.product_search_description || '';

    // Breadcrumb
    document.getElementById('bc-name').textContent = name;
    document.title = `${name} · Aura AI`;

    // Image
    if (imgUrl) {
      const img = document.getElementById('product-img');
      img.src = imgUrl;
      img.alt = name;
      img.style.display = 'block';
      document.getElementById('img-placeholder').style.display = 'none';
    }

    // Discount tag
    if (orig && price && orig > price) {
      const pct = Math.round((1 - price / orig) * 100);
      const tag = document.getElementById('discount-tag');
      tag.textContent = `${pct}% OFF`;
      tag.style.display = 'block';
    }

    // Text fields
    document.getElementById('product-brand').textContent = brand;
    document.getElementById('product-name').textContent = name;
    document.getElementById('product-price').textContent = rupee(price);
    document.getElementById('product-stars').innerHTML = stars();
    document.getElementById('product-desc').textContent = desc || 'No description available.';

    if (orig && orig !== price) {
      document.getElementById('product-price-orig').textContent = rupee(orig);
      document.getElementById('product-price-orig').style.display = 'inline';
      const saved = Math.round(orig - price);
      document.getElementById('product-price-save').textContent = `Save ${rupee(saved)}`;
      document.getElementById('product-price-save').style.display = 'inline';
    }

    // Chips
    const chips = [];
    if (variant) chips.push(`<div class="chip">📦 <strong>${variant}</strong></div>`);
    if (usage)   chips.push(`<div class="chip">🏷️ <strong>${usage}</strong></div>`);
    if (brand)   chips.push(`<div class="chip">🏷 <strong>${brand}</strong></div>`);
    document.getElementById('product-chips').innerHTML = chips.join('');

    // Show content
    document.getElementById('product-skeleton').style.display = 'none';
    document.getElementById('product-content').style.display = 'block';

    // Load related products
    fetchRelated(imgUrl);
  } catch (err) {
    console.error('[product] load failed:', err);
    document.getElementById('product-skeleton').innerHTML =
      '<p style="color:var(--muted);padding:3rem;text-align:center">Failed to load product.</p>';
  }
}

// ── Fetch related products via image similarity ─────────────────────────────
async function fetchRelated(imgUrl) {
  const grid = document.getElementById('related-grid');
  const status = document.getElementById('related-status');

  if (!imgUrl) {
    grid.innerHTML = '<p style="color:var(--muted);font-size:.85rem">No image for similarity search.</p>';
    return;
  }

  try {
    const imgRes = await fetch(imgUrl);
    if (!imgRes.ok) throw new Error('image fetch failed');
    const blob = await imgRes.blob();
    const ext = blob.type.includes('png') ? '.png' : '.jpg';
    const form = new FormData();
    form.append('file', new File([blob], 'product' + ext, {type: blob.type}));

    const res = await fetch(`${API}/similar-products-im`, { method: 'POST', body: form });
    const data = await res.json();
    console.log('[related] similar products response:', data);

    if (!data.data?.length) {
      grid.innerHTML = '<p style="color:var(--muted);font-size:.85rem;grid-column:1/-1">No similar products found.</p>';
      return;
    }

    grid.innerHTML = data.data
      .filter(item => String(item.id) !== String(productId))  // exclude self
      .map(item => {
        const m = item.metadata || {};
        const iname  = m.name || item.name || item.product_search_description || '';
        const iurl   = safeImg(m.image_url || item.image_url || '');
        const iprice = m.discounted_price || item.discounted_price || m.price || item.price || '';
        const ibrand = m.brand || item.brand || '';
        const score  = item.score ? (item.score * 100).toFixed(0) : '';
        const iid    = item.id || m.id || '';
        return `
          <div class="prod-card" onclick="window.location.href='/product/${iid}'">
            <div class="card-img-wrap">
              <img src="${iurl}" alt="${iname}" loading="lazy" onerror="this.src='';this.style.opacity='.1'">
            </div>
            <div class="card-body">
              ${ibrand ? `<div class="card-brand">${ibrand}</div>` : ''}
              <div class="card-name">${iname}</div>
              <div class="card-price">${rupee(iprice)}</div>
              ${score ? `<div class="score-badge">Match ${score}%</div>` : ''}
            </div>
          </div>`;
      }).join('');
  } catch (err) {
    console.error('[related] fetch failed:', err);
    grid.innerHTML = '<p style="color:var(--muted);font-size:.85rem;grid-column:1/-1">Could not load similar products.</p>';
  }
}

loadProduct();
</script>
</body>
</html>
